[package]
edition = "2024"
name = "pico2w-300yen-lcd"
version = "0.2.2"
license = "MIT OR Apache-2.0"

[dependencies]
# Embassy core
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt"] }
# imagedef-none: IMAGE_DEF は embassy ではなく本クレートの image_def モジュールで定義する
# (版数 VERSION 項目と TBYB フラグを載せるため)。binary-info: picotool info 用のメタデータ。
embassy-rp = { version = "0.9", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "imagedef-none", "binary-info"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.7", features = ["defmt"] }
embassy-futures = { version = "0.1" }
embassy-usb = { version = "0.6", default-features = false }

# Logging
defmt = "1"
defmt-rtt = "1"

# Cortex-M
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.1"
panic-probe = { version = "1", features = ["print-defmt"] }

# PIO
pio = "0.3"
pio-proc = "0.3"

# Fixed point (PIO clock divider)
fixed = "1"
fixed-macro = "1"

# Static allocation
static_cell = "2"

# Graphics (Layer 6 で使用)
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-sdmmc = { version = "0.10", default-features = false }

# Wi-Fi (CYW43439, wifi_status で使用)
# cyw43-pio 0.9 / cyw43 0.6 / embassy-net 0.8 が embassy-rp 0.9 と組み合わせられる世代
cyw43 = { version = "0.6", features = ["defmt"] }
cyw43-pio = { version = "0.9", features = ["defmt"] }
embassy-net = { version = "0.8", features = ["defmt", "proto-ipv4", "dhcpv4", "tcp", "udp", "dns", "medium-ethernet"] }
heapless = "0.8"

# HTTPS / OTA (wifi_ota で使用)
# rsa: GitHub のアセット配信ホスト (*.githubusercontent.com) は RSA 4096 の証明書なので、
# RSA 署名方式を ClientHello に載せないと TLS 1.3 ハンドシェイクが成立しない。
# embedded-tls の rsa は alloc を要求するため embedded-alloc でヒープを用意する。
# defmt feature は付けない: embedded-tls 0.18.0 の rsa 経路に defmt::Format を実装しない型の
# error! があり、embedded-tls/defmt を有効にするとコンパイルできない。
reqwless = { version = "0.14", default-features = false, features = ["embedded-tls", "rsa"] }
# embedded-tls 0.18.0 は der "0.8.0-rc.2" 以上を要求するが、Cargo が選ぶ der 0.8.2 (正式版) では API が
# 変わっていて rustpki がコンパイルできない (SequenceOf/SetOf が heapless feature の後ろへ移動、
# Header::tag() の有無)。embedded-tls 0.18.0 (2026-01) 当時の最新 rc.10 に固定する。
der = { version = "=0.8.0-rc.10", default-features = false }
embedded-alloc = { version = "0.7", default-features = false, features = ["llff"] }
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
# reqwless 0.14 が使う embedded-tls 0.18 と同じ sha2 0.10 を共有する
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6", default-features = false }

[features]
default = []
# IMAGE_DEF に TBYB (Try Before You Buy) フラグを立てる。OTA で書き込む
# イメージ用。FLASH_UPDATE 起動でのみ選ばれ、explicit_buy するまで確定しない。
tbyb = []
# テスト用: ota_selftest が explicit_buy を呼ばない (ウォッチドッグで旧イメージへ戻る)。
skip-buy = []

[profile.dev]
debug = 2
opt-level = 2

[profile.release]
debug = 2
lto = "fat"
opt-level = 2

[[bin]]
name = "layer0_gpio_test"
path = "src/bin/layer0_gpio_test.rs"

[[bin]]
name = "layer1_pio_clock"
path = "src/bin/layer1_pio_clock.rs"

[[bin]]
name = "layer2_hsync_vsync"
path = "src/bin/layer2_hsync_vsync.rs"

[[bin]]
name = "layer3_solid_color"
path = "src/bin/layer3_solid_color.rs"

[[bin]]
name = "layer4_dma_colorbar"
path = "src/bin/layer4_dma_colorbar.rs"

[[bin]]
name = "layer5_framebuffer"
path = "src/bin/layer5_framebuffer.rs"

[[bin]]
name = "layer6_drawtest"
path = "src/bin/layer6_drawtest.rs"

[[bin]]
name = "layer7_fullframe_dma"
path = "src/bin/layer7_fullframe_dma.rs"

[[bin]]
name = "layer7_double_buffer_dma"
path = "src/bin/layer7_double_buffer_dma.rs"

[[bin]]
name = "layer7_single_buffer_dma"
path = "src/bin/layer7_single_buffer_dma.rs"

[[bin]]
name = "sd_bmp_viewer"
path = "src/bin/sd_bmp_viewer.rs"

[[bin]]
name = "wifi_status"
path = "src/bin/wifi_status.rs"

[[bin]]
name = "ota_selftest"
path = "src/bin/ota_selftest.rs"

# Wi-Fi OTA (第 2 段階): wifi_status + GitHub Release からの自己更新。Release 用は --features tbyb
[[bin]]
name = "wifi_ota"
path = "src/bin/wifi_ota.rs"

# 診断用: 9e9d7f1 の単一バッファ表示に SM1 テーブルの SRAM 配置だけを加えたもの
[[bin]]
name = "ota_selftest_min"
path = "src/bin/ota_selftest_min.rs"
